name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BIN_NAME: ElectroDynamix   # имя из [package] name в Cargo.toml

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            platform: Linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            platform: Windows
          - os: macos-latest        # Apple Silicon
            target: aarch64-apple-darwin
            arch: aarch64
            platform: MacOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Read version and archive name
        id: meta
        shell: bash
        run: |
          VERSION=$(cargo pkgid | sed 's/.*[#@]//')

          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Version in Cargo.toml (v$VERSION) is not same as (${{ github.ref_name }})"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=$BIN_NAME-${{ matrix.arch }}-${{ matrix.platform }}-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir out
          cp target/${{ matrix.target }}/release/$BIN_NAME out/
          tar -czf ${{ steps.meta.outputs.archive }}.tar.gz -C out .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir out
          cp target/${{ matrix.target }}/release/$env:BIN_NAME.exe out/
          Compress-Archive -Path out/* -DestinationPath "${{ steps.meta.outputs.archive }}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip